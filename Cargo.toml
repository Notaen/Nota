[workspace]
default-members=["crates/nota-cli"]
members = ["crates/nota-core", "crates/nota-infra", "crates/nota-onebot", "crates/nota-cli"]
resolver = "3"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
unwrap_used = "warn"
todo = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
map_unwrap_or = "warn"
large_enum_variant = "warn"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
chrono = "0.4"
clap = "4"
console = "0.16"
dialoguer = "0.12"
dirs = "6"
futures-util = "0.3"
http = "1"
log = "0.4"
reqwest = "0.13"
rusqlite = "0.40"
serde = "1.0"
serde_json = "1"
tokio = "1.53"
tokio-tungstenite = { version = "0.30", default-features = false }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = "0.3"
uuid = "1"
